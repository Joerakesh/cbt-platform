version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile

    ports:
      - "3000:3000"

    environment:
      - MONGODB_URI=mongodb://mongo:27017/cbt

    depends_on:
      - mongo

    restart: always

  mongo:
    image: mongo:7

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
